    unit: INR/km (engine servicing, oil, clutch, chain)
    source: "Illustrative; ICE 2W commercial maintenance typically 1.5-2x EV"
    as_of: "2026-11"
    confidence: low
  maintenance_age_escalation_py:
    value: 0.10
    unit: fractional increase per year of age
    source: "Illustrative"
    as_of: "2026-11"
    confidence: low
  insurance_py:
    value: 6500
    unit: INR/vehicle/year
    source: "Illustrative"
    as_of: "2026-11"
    confidence: low
  residual_value_pct:
    value: 0.25
    unit: fraction of purchase cost after 5 years
    source: "Illustrative; ICE 2W resale market is deeper than EV today"
    as_of: "2026-11"
    confidence: low
  fuel_system_overhaul_cost:
    value: 8000
    unit: INR at year 3 (carburettor/FI, clutch, major service)
    source: "Illustrative"
    as_of: "2026-11"
